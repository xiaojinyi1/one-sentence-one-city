name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 只给发布需要的权限：读代码、写 Pages、用 OIDC 换部署令牌
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # 仓库的 Pages 源需要是 "GitHub Actions"（Settings → Pages 里点一次）。
      # GITHUB_TOKEN 无法自己创建 Pages 站点（会报 Resource not accessible by integration），
      # 所以这里不开 enablement。
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
